# Vulnerabilities ignored by `make security` and the CI `audit` step.
# Read by tools/run_pip_audit.py; every entry should be tracked as a Codeberg issue.
#
# Fields:
#   cve:   vulnerability ID (required): CVE-, GHSA- or PYSEC-. pip-audit also
#          matches advisory aliases, so prefer the CVE ID when there is one.
#   notes: why the vulnerability is ignored and when it can be removed (optional)
#   issue: URL of the tracking issue (optional)

