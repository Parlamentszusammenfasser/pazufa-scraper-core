[project]
name = "scraper-core"
license = "GPL-3.0"
version = "0.1.0"
description = "Core library for collecting parliamentary data"
authors = [{name = "Parlamentszusammenfasser"}]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "corelib"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
litellm = "^1.81.13"
instructor = {extras = ["litellm"], version = "^1.14.0"}
w3lib = "^2.4.1"
rapidfuzz = "^3.14.5"
pydantic = ">=2.13"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
ruff = "^0.15.9"
pytest-cov = "^7.0.0"
mypy = "^1.19.1"
datamodel-code-generator = {extras = ["http"], version = "^0.54.0"}
openapi-python-client = "^0.28.2"
types-python-dateutil = "^2.9.0.20260124"
pytest-asyncio = "^1.3.0"
types-pyyaml = "^6.0.12.20260408"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = [
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
    "D107",  # missing docstring in __init__
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tools/**" = ["D"]
"corelib/api_client/**" = ["D", "E501"]
"corelib/api_model.py" = ["D", "E501"]
# ^^^ currently auto generated, if switched to handwritten this will be no longer excluded.

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
docstring-code-format = true
exclude = ["corelib/api_client/**", "corelib/api_model.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=corelib --cov-report=term-missing --cov-report=xml:coverage.xml"

[tool.coverage.run]
omit = [
  "corelib/api_model.py",
  "corelib/api_client/*",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.datamodel-codegen]
disable-timestamp = true
formatters = ["ruff", "ruff-format"]
input-file-type = "openapi"
output = "corelib/api_model.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
url = "https://codeberg.org/PaZuFa/parlamentszusammenfasser/raw/tag/v0.2.3/docs/specs/openapi.yml"
# ^^^ intentionally pinned independently while project version < 0.1
use-annotated = true
use-double-quotes = true
use-standard-collections = true
use-union-operator = true
wrap-string-literal = true
