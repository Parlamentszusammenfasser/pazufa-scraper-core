[project]
name = "pazufa_corelib"
license = "GPL-3.0-only"
version = "0.3.3"
description = "Core library for collecting parliamentary data"
authors = [{ name = "PaZuFa team" }]
maintainers = [{ name = "PaZuFa team", email = "pub@pazufa.de" }]
readme = "README.md"
keywords = [
    "parliament",
    "open-data",
    "scraper",
    "germany",
    "opentelemetry",
]
requires-python = ">=3.12,<3.16"
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha", # based on pazufa-API instability
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: German",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing"
]

[project.optional-dependencies]
# Layers 1 + 2: spans inside the corelib, trace IDs in (Scrapy) log records.
# API only: without an SDK configured by the application every span is a no-op.
otel = [
    "opentelemetry-api>=1.27,<2",
]
# Layer 3: observability.configure() with readable span log lines and
# optional OTLP export (HTTP/protobuf, no grpcio wheel needed).
otel-otlp = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[project.urls]
Homepage = "https://pazufa.de"
Repository = "https://codeberg.org/PaZuFa/pazufa-scraper-core"
Documentation = "https://wiki.pazufa.de/books/scraper-core"
Issues = "https://codeberg.org/PaZuFa/pazufa-scraper-core/issues"
Changelog = "https://codeberg.org/PaZuFa/pazufa-scraper-core/src/branch/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "pazufa_corelib" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.16"
litellm = "^1.96.2"
instructor = { extras = ["litellm"], version = "^1.14.0" }
w3lib = "^2.4.1"
rapidfuzz = "^3.14.5"
pydantic = "^2.13"
pyyaml = "^6.0"
numpy = "^2.4.4"
python-dateutil = ">=2.9.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
ruff = "^0.15.9"
pytest-cov = "^7.0.0"
mypy = "^1.19.1"
datamodel-code-generator = { extras = ["http"], version = "^0.71.0" }
openapi-python-client = "^0.29.1"
types-python-dateutil = "^2.9.0.20260124"
pytest-asyncio = "^1.3.0"
types-pyyaml = "^6.0.12.20260408"
pip-audit = "^2.9.0"
twine = "^6.2.0"
detect-secrets = "^1.5.0"
pylic = "^5.0.1"
opentelemetry-sdk = ">=1.27,<2"  # InMemorySpanExporter for observability tests

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "S", "ASYNC", "DTZ", "PLW1514", "TID251", "TID253", "LOG", "G"]
# PLW1514 (unspecified-encoding) is a preview rule. explicit-preview-rules keeps
# every other preview rule/behaviour off unless it is selected by its full code.
preview = true
explicit-preview-rules = true

ignore = [
    "D100", # missing docstring in public module
    "D104", # missing docstring in public package
    "D107", # missing docstring in __init__
    "S324", # unsecure hashes are used for deduplication
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501", "S101", "TID251", "TID253"]
"pazufa_corelib/observability/**" = ["TID251"]
# Subclasses the SDK's SpanExporter, so it needs the SDK at module level. It is
# only ever imported lazily via observability.__getattr__.
"pazufa_corelib/observability/_log_exporter.py" = ["TID251", "TID253"]
# Only telemetry names; S105 misreads "TOKEN" constants (gen_ai token usage) as
# hardcoded passwords.
"pazufa_corelib/observability/_attributes.py" = ["TID251", "S105"]
"tools/**" = ["D"]
"pazufa_corelib/api_client/**" = ["D", "E501"]
"pazufa_corelib/_api_model_generated.py" = ["D", "E501"]
"pazufa_corelib/api_model_working.py" = ["D", "E501"]
"pazufa_corelib/api_model.py" = ["D","E501"]     #docstrings ignored for now
# E501 is allowed, so that the discriptions fields are truly only different
# to auto generated ones, when the content chages.
# This is needed to keep the diff between them clean.


# OpenTelemetry is optional (extras "otel" / "otel-otlp"). Library code reaches it
# only through pazufa_corelib.observability; SDK/exporter code is imported lazily
# inside functions so a plain install never loads it.
[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = [
    "opentelemetry.sdk",
    "opentelemetry.exporter",
    "litellm.integrations.opentelemetry",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"opentelemetry".msg = "Use pazufa_corelib.observability (span(), TraceContextFilter) instead."
"litellm.integrations.opentelemetry".msg = "Only pazufa_corelib.observability may enable the litellm OTel callback."

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
docstring-code-format = true
exclude = ["pazufa_corelib/api_client/**", "pazufa_corelib/_api_model_generated.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=pazufa_corelib --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85"

[tool.coverage.run]
omit = [
    "pazufa_corelib/_api_model_generated.py",
    "pazufa_corelib/api_model_working.py",
    "pazufa_corelib/api_client/*",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
# Off by default in mypy; required for the @deprecated aliases in api_model.py
# to be reported at type-check time rather than only at runtime.
enable_error_code = ["deprecated"]

[tool.datamodel-codegen]
disable-timestamp = true
formatters = ["ruff-check", "ruff-format"]
input-file-type = "openapi"
output = "pazufa_corelib/_api_model_generated.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
input = "openapi.yaml"
use-annotated = true
use-double-quotes = true
use-standard-collections = true
use-union-operator = true
wrap-string-literal = true

[tool.pylic]
safe_licenses = [
    "MIT",
    "MIT License",
    "BSD License",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "3-Clause BSD License",  # protobuf (via opentelemetry-exporter-otlp-proto-http)
    "Apache-2.0",
    "Apache Software License",
    "ISC License (ISCL)",
    "PSF-2.0",
    "Python Software Foundation License",
    "Mozilla Public License 2.0 (MPL 2.0)",
    "MPL-2.0 AND MIT",
    "Public Domain",
    "MIT-0",  # cffi, installed on Linux only; pylic reports it unused on macOS
]
unsafe_packages = [
    "pazufa_corelib",
    # tiktoken is MIT-licensed but embeds the full license text in its metadata
    # License field, so safe_licenses string matching can't catch it.
    # See: https://github.com/openai/tiktoken/blob/main/LICENSE
    "tiktoken",
]
