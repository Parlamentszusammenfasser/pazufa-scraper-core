[project]
name = "pazufa-corelib"  # PyPI name only — import name remains `corelib`
license = "GPL-3.0-only"
version = "0.1.1rc1"
description = "Core library for collecting parliamentary data"
authors = [{name = "PaZuFa team"}]
maintainers = [{name = "PaZuFa team", email = "pub@pazufa.de"}]
readme = "README.md"
keywords = [
    "parliament",
    "open-data",
    "scraper",
    "germany",
]
requires-python = ">=3.12,<3.15"
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha", # based on pazufa-API instability
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: German",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing"
]

[project.urls]
Homepage      = "https://pazufa.de"
Repository    = "https://codeberg.org/PaZuFa/pazufa-scraper-core"
Documentation = "https://wiki.pazufa.de/books/scraper-core"
Issues        = "https://codeberg.org/PaZuFa/pazufa-scraper-core/issues"
Changelog     = "https://codeberg.org/PaZuFa/pazufa-scraper-core/src/branch/main/CHANGELOG.md"

[tool.poetry]
packages = [{include = "corelib"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
litellm = "^1.81.13"
instructor = {extras = ["litellm"], version = "^1.14.0"}
w3lib = "^2.4.1"
rapidfuzz = "^3.14.5"
pydantic = "^2.13"
pyyaml = "^6.0"
numpy = "^2.4.4"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
ruff = "^0.15.9"
pytest-cov = "^7.0.0"
mypy = "^1.19.1"
datamodel-code-generator = {extras = ["http"], version = "^0.54.0"}
openapi-python-client = "^0.28.2"
types-python-dateutil = "^2.9.0.20260124"
pytest-asyncio = "^1.3.0"
types-pyyaml = "^6.0.12.20260408"
pip-audit = "^2.9.0"
twine = "^6.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = [
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
    "D107",  # missing docstring in __init__
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tools/**" = ["D"]
"corelib/api_client/**" = ["D", "E501"]
"corelib/api_model.py" = ["D", "E501"]
# ^^^ currently auto generated, if switched to handwritten this will be no longer excluded.

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
docstring-code-format = true
exclude = ["corelib/api_client/**", "corelib/api_model.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=corelib --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85"

[tool.coverage.run]
omit = [
  "corelib/api_model.py",
  "corelib/api_client/*",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.datamodel-codegen]
disable-timestamp = true
formatters = ["ruff", "ruff-format"]
input-file-type = "openapi"
output = "corelib/api_model.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
url = "https://codeberg.org/PaZuFa/parlamentszusammenfasser/raw/tag/v0.2.3/docs/specs/openapi.yml"
use-annotated = true
use-double-quotes = true
use-standard-collections = true
use-union-operator = true
wrap-string-literal = true
