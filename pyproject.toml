[tool.poetry]
name = "collector-core"
version = "0.1.0"
description = "Core library for collecting parliamentary data"
authors = ["Parlamentszusammenfasser"]
readme = "README.md"
packages = [{include = "collector_core"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
litellm = "^1.81.13"
instructor = {extras = ["litellm"], version = "^1.14.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
black = "^26.1.0"
isort = "^7.0.0"
pytest-cov = "^7.0.0"
mypy = "^1.19.1"
datamodel-code-generator = {extras = ["http"], version = "^0.54.0"}
openapi-python-client = "^0.28.2"
types-python-dateutil = "^2.9.0.20260124"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=collector_core --cov-report=term-missing --cov-report=xml:coverage.xml"

[tool.coverage.run]
omit = [
  "collector_core/api_model.py",
  "collector_core/api_client/*",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.datamodel-codegen]
disable-timestamp = true
formatters = ["isort", "black"]
input-file-type = "openapi"
output = "collector_core/api_model.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
url = "https://codeberg.org/PaZuFa/parlamentszusammenfasser/raw/branch/main/docs/specs/openapi.yml"
use-annotated = true
use-double-quotes = true
use-standard-collections = true
use-union-operator = true
wrap-string-literal = true
