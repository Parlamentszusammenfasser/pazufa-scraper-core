# Trunk-based: branches get CI through their pull request, main on every
# push. `manual` is the release run (see the `release` step).
when:
  - event: push
    branch: main
  - event: [pull_request, tag, manual]

# Route this workflow to the generic PaZuFa agents.
labels:
  pazufa_scope: generic

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 1

steps:
  - name: setup
    image: python:3.12-slim
    environment:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      POETRY_INSTALLER_PARALLEL: "true"
      PIP_ONLY_BINARY: ":all:"
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install poetry~=2.3.0
      - poetry install --with dev --no-interaction --sync

  - name: check-lock
    image: python:3.12-slim
    depends_on: [setup]
    environment:
      PIP_ONLY_BINARY: ":all:"
    commands:
      - python -m pip install --quiet poetry~=2.3.0
      - poetry check --lock

  - name: format-and-type-check
    image: python:3.12-slim
    depends_on: [setup]
    commands:
      - .venv/bin/ruff format --check .
      - .venv/bin/ruff check .
      - .venv/bin/mypy .

  - name: audit
    image: python:3.12-slim
    depends_on: [setup]
    commands:
      # Ignored vulnerabilities are listed in pip-audit-ignore.yaml
      - .venv/bin/python -m tools.run_pip_audit

  - name: licenses
    image: python:3.12-slim
    depends_on: [ setup , check-lock]
    commands:
      - .venv/bin/pylic check

  - name: test
    image: python:3.12-slim
    depends_on: [setup]
    commands:
      - .venv/bin/pytest

  # --- Cut a release — manual run on main only ---
  # tools/release.py bumps pyproject.toml + CHANGELOG.md, commits and tags
  # vX.Y.Z; this step pushes both to main, and the tag push runs the publish
  # steps below. Optional pipeline variable RELEASE_VERSION, empty = semver
  # from commits. release_token: Codeberg token allowed to push to main,
  # limited to the "manual" event in the Woodpecker secret settings.
  - name: release
    image: python:3.12-slim
    depends_on: [check-lock, format-and-type-check, audit, test, licenses]
    when:
      - event: manual
    environment:
      RELEASE_TOKEN:
        from_secret: release_token
    commands:
      - |
        if [ "${CI_COMMIT_BRANCH}" != "main" ]; then
          echo "ERROR: releases are cut from main only, not '${CI_COMMIT_BRANCH}'" >&2
          exit 1
        fi
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
      - git config --global --add safe.directory "${CI_WORKSPACE}"
      - git fetch --quiet --unshallow --tags "${CI_REPO_CLONE_URL}"
      - python tools/release.py
      # rejected without changes if main moved since this run started
      - git push --atomic --follow-tags "https://release:$${RELEASE_TOKEN}@codeberg.org/${CI_REPO}.git" HEAD:refs/heads/main

  # --- Publish steps — only run on tag push ---

  - name: check-version
    image: python:3.12-slim
    depends_on: [check-lock, format-and-type-check, audit, test, licenses]
    when:
      - event: tag
    commands:
      - TAG_VERSION="${CI_COMMIT_TAG#v}"
      - TOML_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
      - echo "Tag version:$TAG_VERSION  pyproject.toml version:$TOML_VERSION"
      - |
        if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
          echo "ERROR: tag '$TAG_VERSION' does not match pyproject.toml version '$TOML_VERSION'" >&2
          exit 1
        fi

  # A final release must come from reviewed code on main; rc tags may come
  # from any branch.
  - name: check-on-main
    image: woodpeckerci/plugin-git
    depends_on: [check-version]
    when:
      - event: tag
    commands:
      - |
        if echo "${CI_COMMIT_TAG}" | grep -qE 'rc[0-9]+$'; then
          echo "rc tag, not checked"
          exit 0
        fi
      - git config --global --add safe.directory "${CI_WORKSPACE}"
      - git fetch --quiet --unshallow "${CI_REPO_CLONE_URL}" main
      - |
        if ! git merge-base --is-ancestor "${CI_COMMIT_SHA}" FETCH_HEAD; then
          echo "ERROR: ${CI_COMMIT_TAG} (${CI_COMMIT_SHA}) is not on main; final releases are cut from main only" >&2
          exit 1
        fi

  - name: check-not-published
    image: python:3.12-slim
    depends_on: [check-on-main]
    when:
      - event: tag
    commands:
      - VERSION="${CI_COMMIT_TAG#v}"
      - |
        if echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$'; then
          INDEX_URL="https://test.pypi.org/pypi/pazufa_corelib/$VERSION/json"
          INDEX_NAME="TestPyPI"
        elif echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          INDEX_URL="https://pypi.org/pypi/pazufa_corelib/$VERSION/json"
          INDEX_NAME="PyPI"
        else
          echo "ERROR: tag '$CI_COMMIT_TAG' does not match a recognized release pattern (vX.Y.Z or vX.Y.ZrcN)" >&2
          exit 1
        fi
        export INDEX_URL INDEX_NAME VERSION
        python -c "
        import urllib.request, urllib.error, sys, os
        url = os.environ['INDEX_URL']
        name = os.environ['INDEX_NAME']
        version = os.environ['VERSION']
        try:
            urllib.request.urlopen(url)
            print(f'ERROR: v{version} already exists on {name} — bump the version in pyproject.toml or delete the tag', file=sys.stderr)
            sys.exit(1)
        except urllib.error.HTTPError as e:
            if e.code == 404:
                print(f'OK: v{version} not yet on {name}')
            else:
                print(f'ERROR: unexpected HTTP {e.code} from {name}', file=sys.stderr)
                raise
        "

  - name: build
    image: python:3.12-slim
    depends_on: [check-not-published]
    when:
      - event: tag
    environment:
      PIP_ONLY_BINARY: ":all:"
    commands:
      - python -m pip install --quiet poetry~=2.3.0
      - poetry build

  - name: check-dist
    image: python:3.12-slim
    depends_on: [build]
    when:
      - event: tag
    environment:
      PIP_ONLY_BINARY: ":all:"
    commands:
      - pip install --quiet twine
      - twine check dist/* --strict

  - name: publish-testpypi
    image: python:3.12-slim
    depends_on: [check-dist]
    when:
      - evaluate: 'CI_COMMIT_TAG matches "^v[0-9]+[.][0-9]+[.][0-9]+rc[0-9]+$"'
    environment:
      TWINE_REPOSITORY_URL: https://test.pypi.org/legacy/
      TWINE_USERNAME: __token__
      PIP_ONLY_BINARY: ":all:"
      TESTPYPI_TOKEN:
        from_secret: testpypi_token
    commands:
      - pip install --quiet twine
      - TWINE_PASSWORD=$TESTPYPI_TOKEN twine upload dist/*

  - name: publish-pypi
    image: python:3.12-slim
    depends_on: [check-dist]
    when:
      - evaluate: 'CI_COMMIT_TAG matches "^v[0-9]+[.][0-9]+[.][0-9]+$"'
    environment:
      TWINE_USERNAME: __token__
      PIP_ONLY_BINARY: ":all:"
      PYPI_TOKEN:
        from_secret: pypi_token
    commands:
      - pip install --quiet twine
      - TWINE_PASSWORD=$PYPI_TOKEN twine upload dist/*
