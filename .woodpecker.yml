when:
  - event: [push]
    evaluate: 'not (CI_COMMIT_MESSAGE contains "[skip ci]" or CI_COMMIT_MESSAGE contains "[ci skip]")'

# Route this workflow to the generic PaZuFa agents.
labels:
  pazufa_scope: generic

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 1

steps:
  - name: setup
    image: python:3.12-slim
    environment:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      POETRY_INSTALLER_PARALLEL: "true"
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install poetry~=2.3.0
      - poetry install --with dev --no-interaction --sync

  - name: check-lock
    image: python:3.12-slim
    depends_on: [setup]
    commands:
      - python -m pip install --quiet poetry~=2.3.0
      - poetry check --lock

  - name: format-and-type-check
    image: python:3.12-slim
    depends_on: [setup]
    commands:
      - .venv/bin/ruff format --check .
      - .venv/bin/ruff check .
      - .venv/bin/mypy .

  - name: audit
    image: python:3.12-slim
    depends_on: [setup]
    commands:
      - .venv/bin/pip-audit --ignore-vuln GHSA-xqmj-j6mv-4862 --ignore-vuln CVE-2026-3219

  - name: test
    image: python:3.12-slim
    depends_on: [setup]
    commands:
      - .venv/bin/pytest

  # --- Release steps — only run on tag push ---

  - name: check-version
    image: python:3.12-slim
    depends_on: [check-lock, format-and-type-check, audit, test]
    when:
      - event: tag
    commands:
      - TAG_VERSION="${CI_COMMIT_TAG#v}"
      - TOML_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
      - echo "Tag version:$TAG_VERSION  pyproject.toml version:$TOML_VERSION"
      - test "$TAG_VERSION" = "$TOML_VERSION" || { echo "ERROR: tag '$TAG_VERSION' does not match pyproject.toml version '$TOML_VERSION'" >&2; exit 1; }

  - name: check-not-on-pypi
    image: python:3.12-slim
    depends_on: [check-version]
    when:
      - evaluate: 'CI_COMMIT_TAG matches "^v[0-9]+[.][0-9]+[.][0-9]+$"'
    commands:
      - VERSION="${CI_COMMIT_TAG#v}"
      - |
        python -c "
        import urllib.request, urllib.error, sys
        url = f'https://pypi.org/pypi/pazufa-corelib/$VERSION/json'
        try:
            urllib.request.urlopen(url)
            print(f'ERROR: v$VERSION already exists on PyPI — bump the version in pyproject.toml or delete the tag', file=sys.stderr)
            sys.exit(1)
        except urllib.error.HTTPError as e:
            if e.code == 404:
                print(f'OK: v$VERSION not yet on PyPI')
            else:
                print(f'ERROR: unexpected HTTP {e.code} from PyPI', file=sys.stderr)
                raise
        "

  - name: check-not-on-testpypi
    image: python:3.12-slim
    depends_on: [check-version]
    when:
      - evaluate: 'CI_COMMIT_TAG matches "^v[0-9]+.*-rc.*"'
    commands:
      - VERSION="${CI_COMMIT_TAG#v}"
      - |
        python -c "
        import urllib.request, urllib.error, sys
        url = f'https://test.pypi.org/pypi/pazufa-corelib/$VERSION/json'
        try:
            urllib.request.urlopen(url)
            print(f'ERROR: v$VERSION already exists on TestPyPI — bump the version in pyproject.toml or delete the tag', file=sys.stderr)
            sys.exit(1)
        except urllib.error.HTTPError as e:
            if e.code == 404:
                print(f'OK: v$VERSION not yet on TestPyPI')
            else:
                print(f'ERROR: unexpected HTTP {e.code} from TestPyPI', file=sys.stderr)
                raise
        "

  - name: build
    image: python:3.12-slim
    depends_on: [check-not-on-pypi, check-not-on-testpypi, check-version, check-lock, format-and-type-check, audit, test]
    when:
      - event: tag
    commands:
      - python -m pip install --quiet poetry~=2.3.0
      - poetry build

  - name: check-dist
    image: python:3.12-slim
    depends_on: [build]
    when:
      - event: tag
    commands:
      - pip install --quiet twine
      - twine check dist/* --strict

  - name: publish-testpypi
    image: python:3.12-slim
    depends_on: [check-dist]
    when:
      - evaluate: 'CI_COMMIT_TAG matches "^v[0-9]+.*-rc.*"'
    environment:
      TWINE_REPOSITORY_URL: https://test.pypi.org/legacy/
      TWINE_USERNAME: __token__
      TESTPYPI_TOKEN:
        from_secret: testpypi_token
    commands:
      - pip install --quiet twine
      - TWINE_PASSWORD=$TESTPYPI_TOKEN twine upload dist/*

  - name: publish-pypi
    image: python:3.12-slim
    depends_on: [check-dist]
    when:
      - evaluate: 'CI_COMMIT_TAG matches "^v[0-9]+[.][0-9]+[.][0-9]+$" && CI_COMMIT_BRANCH == "main"'
    environment:
      TWINE_USERNAME: __token__
      PYPI_TOKEN:
        from_secret: pypi_token
    commands:
      - pip install --quiet twine
      - TWINE_PASSWORD=$PYPI_TOKEN twine upload dist/*
