when:
  - event: [push, pull_request, tag]

# Route this workflow to the generic PaZuFa agents.
labels:
  pazufa_scope: generic

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 1

steps:
  - name: setup
    image: python:3.12-slim
    environment:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      POETRY_INSTALLER_PARALLEL: "true"
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install poetry~=2.3.0
      - poetry install --with dev --no-interaction --sync

  - name: check-lock
    image: python:3.12-slim
    depends_on: [setup]
    commands:
      - python -m pip install --quiet poetry~=2.3.0
      - poetry check --lock

  - name: format-and-type-check
    image: python:3.12-slim
    depends_on: [setup]
    commands:
      - .venv/bin/ruff format --check .
      - .venv/bin/ruff check .
      - .venv/bin/mypy .

  - name: audit
    image: python:3.12-slim
    depends_on: [setup]
    commands:
      - .venv/bin/pip-audit --ignore-vuln GHSA-xqmj-j6mv-4862 --ignore-vuln CVE-2026-3219

  - name: test
    image: python:3.12-slim
    depends_on: [setup]
    commands:
      - .venv/bin/pytest

  # --- Release steps — only run on tag push ---

  - name: build
    image: python:3.12-slim
    depends_on: [check-lock, format-and-type-check, audit, test]
    when:
      - event: tag
    commands:
      - python -m pip install --quiet poetry~=2.3.0
      - poetry build

  - name: check-dist
    image: python:3.12-slim
    depends_on: [build]
    when:
      - event: tag
    commands:
      - pip install --quiet twine
      - twine check dist/*

  - name: publish-testpypi
    image: python:3.12-slim
    depends_on: [check-dist]
    when:
      - evaluate: 'CI_COMMIT_TAG matches "^v[0-9]+.*-rc.*"'
    environment:
      TWINE_REPOSITORY_URL: https://test.pypi.org/legacy/
      TWINE_USERNAME: __token__
      TESTPYPI_TOKEN:
        from_secret: TESTPYPI_TOKEN
    commands:
      - pip install --quiet twine
      - TWINE_PASSWORD=$TESTPYPI_TOKEN twine upload dist/*

  - name: publish-pypi
    image: python:3.12-slim
    depends_on: [check-dist]
    when:
      - evaluate: 'CI_COMMIT_TAG matches "^v[0-9]+[.][0-9]+[.][0-9]+$" && CI_COMMIT_BRANCH == "main"'
    environment:
      TWINE_USERNAME: __token__
      PYPI_TOKEN:
        from_secret: PYPI_TOKEN
    commands:
      - pip install --quiet twine
      - TWINE_PASSWORD=$PYPI_TOKEN twine upload dist/*
