              schema:
                type: string
          description: ''
      security:
        - apiKey:
            - keyadder
      tags:
        - Authentifizierung
  /api/v2/auth/rotate:
    post:
      description: Key rotation endpoint for creating a new API key while maintaining
        the existing one for a transition period of one day.  The old key remains
        valid until the specified rotation_complete_date, after which it is automatically
        revoked. Rotates only the own key if it is not invalid.
      operationId: auth_rotate
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  new_api_key:
                    description: The newly created API key (shown only once)
                    type: string
                  rotation_complete_date:
                    description: Confirmed date when the old key will be invalidated
                    format: date-time
                    type: string
                required:
                  - new_api_key
                  - rotation_complete_date
                type: object
          description: ''
        '401':
          description: ''
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: ''
      security:
        - apiKey:
            - collector
            - admin
            - keyadder
      summary: '`AuthRotate` - POST /api/v1/auth/rotate

        Endpoint to rotate your own key for a fresh one. The old key is valid for
        a certain transition

        period after which it automatically invalidates. If called repeatedly it makes
        sure that only

        ever a maximum of two (1) keys is valid, a maximum of one of which is in rotation.

        This endpoint requires authentication.

        # Security

        There should always ever be at most two keys in an active rotation relationship
        (`rotated_for!=NULL` && `deleted_by!=NULL`)

        And the rotation date must never be expanded, otherwise you can just prolong
        your old key''s life indefinitely'
      tags:
        - Authentifizierung
