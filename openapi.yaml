          schema:
            $ref: '#/components/schemas/AuthDeleteHeaderParams'
      responses:
        '204':
          description: ''
        '400':
          description: Malformed Request
        '401':
          description: Authentication failed
        '403':
          description: Authorization failed
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      security:
        - apiKey:
            - keyadder
      tags:
        - Authentifizierung
    post:
      operationId: auth_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKey'
        required: true
      responses:
        '201':
          content:
            text/plain:
              schema:
                type: string
          description: ''
        '400':
          description: ''
        '401':
          description: ''
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: ''
      security:
        - apiKey:
            - keyadder
      tags:
        - Authentifizierung
  /api/v2/auth/keys:
    get:
      operationId: auth_listing
      parameters:
        - description: Filter results to include only items updated on or after this
            timestamp (inclusive lower bound)
          in: query
          name: since
          required: false
          schema:
            format: date-time
            type: string
        - description: Filter results to include only items updated on or before this
            timestamp (inclusive upper bound)
          in: query
          name: until
          required: false
          schema:
            format: date-time
            type: string
        - description: Page number for paginated results. Starts at 1.
          in: query
          name: page
          required: false
          schema:
            format: int32
            minimum: 0
            type: integer
        - description: Number of items to return per page. Maximum value is capped
            at server-defined limit.
          in: query
          name: per_page
          required: false
          schema:
            format: int32
            minimum: 0
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                description: A uniquely identifying string that is generated from
                  key data within the database
                type: string
          description: Ok
          headers:
            link:
              schema:
                description: "Used for pagination. \n        Contains links to the\
                  \ first, previous, next, and last pages of results.\n        Format\
                  \ follows RFC 5988 Web Linking standard."
                example: <https://api.example.com/resources?page=3&per_page=20>; rel="next",
                  <https://api.example.com/resources?page=5&per_page=20>; rel="last",
                  <https://api.example.com/resources?page=1&per_page=20>; rel="first",
                  <https://api.example.com/resources?page=1&per_page=20>; rel="prev"
                type: string
            x-page:
              schema:
                description: Current page number
                format: int32
                minimum: 0
                type: integer
            x-per-page:
              schema:
                description: Number of items per page
                format: int32
                minimum: 0
                type: integer
            x-total-count:
              schema:
                description: Total number of pages available
                format: int32
                minimum: 0
                type: integer
            x-total-pages:
              schema:
                description: Total number of pages available
                format: int32
                minimum: 0
                type: integer
        '204':
          description: No Content
        '304':
          description: Not Modified
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: Error
      security:
        - apiKey:
            - keyadder
      tags:
        - Authentifizierung
  /api/v2/auth/keys/{keytag}:
    get:
