    Sitzung:
      description: 'plenary session, committee session or committee hearing.

        A session is a hearing if experts are invited.'
      properties:
        api_id:
          description: 'optional, here for future references. Is generated by the
            server.

            If you set it use UUID version 5 with your collector id as namespace'
          format: uuid
          type:
            - string
            - 'null'
        dokumente:
          description: Announcements, agendas and changed/amended agendas
          items:
            $ref: '#/components/schemas/DokumentOrApiId'
          type: array
        experten:
          description: List of invited experts. if this is not null or empty, a session
            is a hearing.
          items:
            $ref: '#/components/schemas/Autor'
          type: array
        gremium:
          $ref: '#/components/schemas/Gremium'
        link:
          format: uri
          type:
            - string
            - 'null'
        nummer:
          format: int32
          minimum: 0
          type: integer
        public:
          type: boolean
        termin:
          format: date-time
          type: string
        titel:
          description: Title if applicable
          type:
            - string
            - 'null'
        tops:
          items:
            $ref: '#/components/schemas/Top'
          type: array
        touched_by:
          description: list of scraper uuids / key database ids that have touched
            this object
          items:
            $ref: '#/components/schemas/TouchedByInner'
          type: array
      required:
        - termin
        - gremium
        - nummer
        - public
        - tops
      type: object
    Station:
      description: 'In many ways a station is the heart of this API.

        Every Vorgang consists of stations, which have only very few required fields.

        They represent meaningful steps that any Vorgang takes from start to finish.

        For further details, see the documentation.'
      properties:
        additional_links:
          description: Further links to interesting infos for this station
          example: https://example.com/video/of/plenary/session
          items:
            format: uri
            type: string
          type: array
        api_id:
          description: optional, here for future references. Is generated by the server.
            If you set it use UUID version 5 with your collector id as namespace
          format: uuid
          type:
            - string
            - 'null'
        dokumente:
          description: 'Documents that make up the Station or are associated with
            it.

            NOTE: At upload time, only complete documents are accepted;

            At download time, only the API IDs of the documents are passed down to
            the clients.'
          items:
            $ref: '#/components/schemas/DokumentOrApiId'
          type: array
        gremium:
          $ref: '#/components/schemas/Gremium'
        gremium_federf:
          description: If the station if of type parl-ausschbsl, this field should
            be set if the committee is the main committee ('federführend')
          type:
            - boolean
            - 'null'
        link:
          description: Link to a web page describing this station in more detail,
            NOT to a pdf document
          format: uri
          type:
            - string
            - 'null'
        schlagworte:
          items:
            type: string
          type: array
        stellungnahmen:
          items:
            $ref: '#/components/schemas/DokumentOrApiId'
          type: array
        titel:
          description: optional title, if other data does not provide a proper description
          type:
            - string
            - 'null'
        touched_by:
          description: list of scraper uuids / key database ids that have touched
            this object
          items:
            $ref: '#/components/schemas/TouchedByInner'
          type: array
        typ:
          $ref: '#/components/schemas/Stationstyp'
        zp_modifiziert:
          description: 'Date of the last relevant action within this station. i.e.:
            last session of a committee'
          format: date-time
          type:
            - string
            - 'null'
        zp_start:
          description: 'Date of the first action within this station. i.e.: First
            session of a committee'
          format: date-time
          type: string
      required:
        - zp_start
        - gremium
        - typ
        - dokumente
      type: object
    Stationstyp:
      description: 'Substantive legislative steps, that a Vorgang can pass on its
        way to a law or rejection or similar endings.

        The categorisation pre/postparl is to a degree arbitrary, these are just identifiers.'
      enum:
        - preparl-regent
        - preparl-eckpup
        - preparl-regbsl
        - preparl-vbegde
        - preparl-formvs
        - parl-initiativ
        - parl-antragsst
        - parl-ausschber
        - parl-vollvlsgn
        - parl-akzeptanz
        - parl-ablehnung
        - parl-zurueckgz
        - parl-ggentwurf
        - parl-vermittas
        - parl-verfgstop
        - postparl-vesja
        - postparl-vesne
        - postparl-gsblt
        - postparl-kraft
        - sonstig
      type: string
    Top:
      description: An item on the agenda
      properties:
        dokumente:
          description: documents handled in this agenda item
          items:
            $ref: '#/components/schemas/DokumentOrApiId'
          type: array
        nummer:
          description: number of this item on the agenda
          format: int32
          minimum: 0
          type: integer
        titel:
          type: string
        vorgang_id:
          description: 'api ids of associated Vorgang objects.

            Is ignored at upload time, but passed at download time.

            The matching happens via the documents supplied below'
          items:
            format: uuid
            type: string
          type: array
      required:
        - nummer
        - titel
      type: object
    TouchedByInner:
      properties:
        key:
          description: Key hash of the scraper that touched the object
          type:
            - string
            - 'null'
        scraper_id:
          description: uuid of the scraper that touched this object
          format: uuid
          type:
            - string
            - 'null'
      type: object
    VgIdent:
      description: 'Unique identifyer for a Vorgang within a parliament and election
        period: Vorgangsnummer, Initiativdrucksache, ...'
      properties:
        id:
          type: string
        typ:
          type: string
      required:
        - id
        - typ
      type: object
    Vorgang:
      description: '''Master Object of the API. Wrapper type around stations.

        `Vorgang` describes not only legislative processes, but also other kinds of
        parliamentary

        proceedings'
      properties:
        api_id:
          description: Use UUID version 5 with your collector id as namespace
          format: uuid
          type: string
        ids:
          items:
            $ref: '#/components/schemas/VgIdent'
          type: array
        initiatoren:
          description: List of persons or organisations, which initiated the Vorgang.
          items:
            $ref: '#/components/schemas/Autor'
          type: array
        kurztitel:
          type:
            - string
            - 'null'
        links:
          items:
            format: uri
            type: string
          type: array
        lobbyregister:
          description: Lobby register annotations from Bundestag sources
          items:
            $ref: '#/components/schemas/Lobbyregeintrag'
          type: array
        ressort:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Ressort'
              description: Ressort. Skipped if None
        sachgebiete:
          description: Sachgebiet information
          items:
            $ref: '#/components/schemas/Sachgebiet'
          type: array
        stationen:
          description: List of stations, the core of what happens in one Proceeding
          items:
            $ref: '#/components/schemas/Station'
          type: array
        titel:
          type: string
        touched_by:
          description: list of scraper uuids / key database ids that have touched
            this object
          items:
            $ref: '#/components/schemas/TouchedByInner'
          type: array
        typ:
          $ref: '#/components/schemas/Vorgangstyp'
        verfassungsaendernd:
          description: 'Is this Vorgang directly intended to change the constitution
            of whatever state it happens

            in?'
          type: boolean
        wahlperiode:
          description: number of the electoral period
          format: int32
          minimum: 0
          type: integer
      required:
        - api_id
        - titel
        - wahlperiode
        - verfassungsaendernd
        - typ
        - initiatoren
        - stationen
      type: object
    Vorgangstyp:
      description: The legislative Track we are on. Together with a parliament, this
        tells us about the possible stations that can occurr within
      enum:
        - gg-einspruch
        - gg-zustimmung
        - gg-land-parl
        - gg-land-volk
        - bw-einsatz
        - sonstig
      type: string
    ZusammenfassungWrapper:
      oneOf:
        - type: string
        - items:
            $ref: '#/components/schemas/Zusammenfassungstupel'
          type: array
    Zusammenfassungstupel:
      description: 'A typed partial summary of a document.

        NOTE: Documents can only contain one summary of any type.

        If on merge a different text is supplied for an existing type of summary,
        it replaces the old

        one'
      properties:
        inhalt:
          description: Content of the summary part
          example: Das Gesetz zur Haarfärbeverordnung dient der Umsetzung der EU-Richtline
            42/69420 zur Schuppenfreiheit bei Eigenschaftsänderlichen Haarmodifikationen
            vor...
          type: string
        typ:
          description: 'Type of summary, if the summary is made up of parts

            NOTE: there are some reserved type names:

            - `full`        means summary of the full document without origin info

            - `full-llm`    means summary of the full document, made by llm

            - `full-extern` means summary of the full document, taken from an external
            source


            You are free to add to these if required, just please stick to the ones
            available if

            possible'
          example: Basisinformationen
          type: string
      type: object
  securitySchemes:
    apiKey:
      description: "\n        API key of the Collector.\n        - Expires based on\
        \ 'expires_at' field when created (if not specified, defaults to 1 year)\n\
        \        - Subject to rate limiting of 256 requests per second across all\
        \ endpoints\n        - Subject to body size limit of 512 MB\n        - Tokens\
        \ can be revoked at any time by administrators\n\n        API Key Rotation\
        \ Policy:\n        - Keys should be rotated at least every 90 days (recommended)\n\
        \        - A transition period of 1 hour is supported during rotation where\
        \ both old and new keys are valid\n        - When rotating keys, use the /api/v2/auth/rotate\
        \ endpoint rather than creating and deleting keys separately\n        - During\
        \ rotation, both keys remain valid until the rotation_complete_date is reached\n\
        \        - After the rotation_complete_date, the old key is automatically\
        \ invalidated"
      in: header
      name: X-API-KEY
      type: apiKey
