      operationId: vorgang_get_by_id
      parameters:
        - description: Unique identifier (UUID) of the object to identify
          in: path
          name: api_id
          required: true
          schema:
            format: uuid
            type: string
        - in: header
          name: if_modified_since
          required: false
          schema:
            format: date-time
            type:
              - string
              - 'null'
        - description: if `true`, deliver documents as full, expanded objects instead
            of just their api id
          in: query
          name: expand
          required: false
          schema:
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vorgang'
          description: ''
        '304':
          description: ''
        '400':
          description: ''
        '404':
          description: ''
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: ''
        '501':
          description: ''
      tags:
        - Vorgang
        - Unauthorisiert
    put:
      description: Administrative endpoint to directly set or replace a legislative
        process without merging or matching. Replaces the entire process data if it
        exists, or creates a new one if it doesn't.
      operationId: vorgang_id_put
      parameters:
        - description: Unique identifier (UUID) of the object to identify
          in: path
          name: api_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vorgang'
        required: true
      responses:
        '201':
          description: Ressource Created
        '304':
          description: Ressource was not modified
        '400':
          content:
            text/plain:
              schema:
                type: string
          description: Malformed Request
        '401':
          description: Authentication or Authorization failed
        '409':
          description: Conflict creating the ressource
        '500':
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      security:
        - apiKey:
            - admin
            - keyadder
      tags:
        - Vorgang
        - Data-Administration
