components:
  schemas:
    ApiKeyStatus:
      description: Status information about the API key used in the current request
      properties:
        expires_at:
          description: When this key will expire. If `is_being_rotated` is true, this
            is the date the rotation is complete.
          format: date-time
          type: string
        is_being_rotated:
          description: Whether this key is currently in a transition process
          type: boolean
        scope:
          description: 'Note: inline enums are not fully supported by openapi-generator'
          type: string
      required:
        - scope
        - expires_at
        - is_being_rotated
      type: object
    AuthDeleteHeaderParams:
      properties:
        api_key_delete:
          type: string
      required:
        - api_key_delete
      type: object
    Autor:
      description: 'Person or organisation in some function. e.g.:

        - authors of a statement,

        - expert at a hearing,

        - initiator of a Vorgang

        - authoring organisations of documents'
      properties:
        fachgebiet:
          type:
            - string
            - 'null'
        lobbyregister:
          format: uri
          type:
            - string
            - 'null'
        organisation:
          type: string
        person:
          type:
            - string
            - 'null'
      required:
        - organisation
      type: object
    CreateApiKey:
      description: Requests a new API key. The key will be saved as hash in the database
        and only produced once in clear text.
      properties:
        expires_at:
          description: The expiration date of the API Key
          format: date-time
          type:
            - string
            - 'null'
        scope:
          description: 'Note: inline enums are not fully supported by openapi-generator'
          type: string
      required:
        - scope
      type: object
    Doktyp:
      description: Type of a Document
      enum:
        - eckpunktepapier
        - preparl-entwurf
        - entwurf
        - antrag
        - anfrage
        - antwort
        - mitteilung
        - beschlussempf
        - stellungnahme
        - gutachten
        - redeprotokoll
        - tops
        - tops-aend
        - tops-ergz
        - gesetz
        - sonstig
      type: string
    Dokument:
      description: 'A document. Could be a protocol, a Drucksache, a statement, ...

        For different objects, only certain properties are optional, which is a known
        design flaw.

        A Stellungnahme must contain `meinung`, a Gesetzentwurf contains `Vorwort`.

        Since documents can become quite large, they are returned by the server as
        just their `api_id` in lists'
      properties:
        api_id:
          description: optional, here for future references. Is generated by the server.
            If you set it use UUID version 5 with your collector id as namespace
          format: uuid
          type:
            - string
            - 'null'
        autoren:
          description: List of authors of the document. Could be a person, organisation
            or a parliamentary body
          items:
            $ref: '#/components/schemas/Autor'
          type: array
        drucksnr:
          type:
            - string
            - 'null'
        hash:
          $ref: '#/components/schemas/HashWrapper'
          description: corresponds to sha256+bytes, here for backwards compatibility
        kurztitel:
          description: Brief, Summarized, layman-readable title of the document
          type:
            - string
            - 'null'
        link:
          format: uri
          type: string
        meinung:
          description: 'General opinion of the gremium about the Document

            Stellungnahme:       1=very bad, 5=very good

            Beschlussempfehlung: 1=rejection recommended, 2-4=accept in changed form,
            5=acceptence recommended'
          format: int32
          maximum: 5
          minimum: 1
          type:
            - integer
            - 'null'
        schlagworte:
          description: Keywords associated with this document
          items:
            type: string
          type: array
        subdoc_id:
          description: 'If a document contains more than one semantically closed document
            (x opinions in a collected file for example)

            this denotes the index of the sub-file in question. They can potentially
            share a hash.'
          format: int32
          minimum: 0
          type:
            - integer
            - 'null'
        titel:
          description: Official Title of the Document
          type: string
        touched_by:
          description: list of scraper uuids / key database ids that have touched
            this object
          items:
            $ref: '#/components/schemas/TouchedByInner'
          type: array
        typ:
          $ref: '#/components/schemas/Doktyp'
        volltext:
          description: Full text of the document, possibly normalized
          type: string
        vorwort:
          description: Preamble, synopsys or statement of intent
          type:
            - string
            - 'null'
        zp_erstellt:
          description: Protocol of the session on 7.3., *created on 8.3.* modified
            on 9.3.
          format: date-time
          type:
            - string
            - 'null'
        zp_modifiziert:
          description: Protocol of the session on 7.3., created on 8.3. *modified
            on 9.3*.
          format: date-time
          type: string
        zp_referenz:
          description: Protocol of the *session on 7.3.*, created on 8.3. modified
            on 9.3.
          format: date-time
          type: string
        zusammenfassung:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ZusammenfassungWrapper'
              description: Summary of the document's contents
      required:
        - typ
        - titel
        - volltext
        - zp_modifiziert
        - zp_referenz
        - link
        - hash
        - autoren
      type: object
    DokumentFormat:
      description: Format of return of the documents. Defaults to pazufa
      enum:
        - ftm
        - pazufa
      type: string
    DokumentHash:
      properties:
        mime:
          $ref: '#/components/schemas/Mime'
          description: 'The mime of the hashed content.

            If sha256/1+bytes was used, must be application/pdf;

            If sha256+text was used, must be text/plain'
        strategy:
          $ref: '#/components/schemas/HashStrategy'
          description: 'The strategy used to compute the hash.

            sha256+text denotes that not the raw file, but the _exact_ volltext field

            of the document was hashed.

            All text must be utf-8, remain stable under subsequent extraction,

            and mime must be set to text/plain or text/html.'
        value:
          description: Hash value as string of hexadecimal octets
          type: string
      required:
        - value
        - strategy
        - mime
      type: object
    DokumentOrApiId:
      oneOf:
        - $ref: '#/components/schemas/Dokument'
        - format: uuid
          type: string
    EnumerationNames:
      description: Enumeration of values
      enum:
        - schlagworte
        - stationstypen
        - vorgangstypen
        - parlamente
        - vgidtypen
        - dokumententypen
      type: string
    Gremium:
      description: 'A body in which decisions can be made: committees, plenary halls,
        cabinett, peoples, ...'
      properties:
        link:
          format: uri
          type:
            - string
            - 'null'
        name:
          description: Name of the body. 'plenum', 'regierung', 'volk' are reserved
          type: string
        parlament:
          $ref: '#/components/schemas/Parlament'
        wahlperiode:
          format: int32
          minimum: 0
          type: integer
      required:
        - parlament
        - wahlperiode
        - name
      type: object
    HashStrategy:
      enum:
        - sha256+bytes
        - sha256+text
        - sha1+bytes
      type: string
    HashWrapper:
      oneOf:
        - type: string
        - items:
            $ref: '#/components/schemas/DokumentHash'
          type: array
    KeytagListing:
      properties:
        dokumente:
          items:
            type: string
          type:
            - array
            - 'null'
        sitzungen:
          items:
            type: string
          type:
            - array
            - 'null'
        stationen:
          items:
            type: string
          type:
            - array
            - 'null'
        vorgaenge:
          items:
            type: string
          type:
            - array
            - 'null'
      type: object
    Lobbyregeintrag:
      description: Entry of the Bundestagslobbyregister for a specific Vorgang
      properties:
        betroffene_drucksachen:
          description: 'Array with associated Drucksachennummern.

            Is not crossreferenced in the database and just added as dataset'
          items:
            type: string
          type: array
        intention:
          description: Subject and reason for influencing the legislative process
          type: string
        interne_id:
          description: Internal ID within the register, necessary to build a url for
            it
          type: string
        link:
          description: direct link to the entry
          format: uri
          type: string
        organisation:
          $ref: '#/components/schemas/Autor'
      required:
        - organisation
        - interne_id
        - intention
        - link
        - betroffene_drucksachen
      type: object
    Mime:
      enum:
        - application/json
        - application/pdf
        - text/plain
        - text/html
      type: string
    Parlament:
      description: Enumeration of parliaments or similar bodies in germany
      enum:
        - BT
        - BR
        - BV
        - EK
        - BB
        - BY
        - BE
        - HB
        - HH
        - HE
        - MV
        - NI
        - NW
        - RP
        - SL
        - SN
        - TH
        - SH
        - BW
        - ST
      type: string
    ReplacementPutRequestInner_Autor:
      properties:
        replaced_by:
          description: This object is replaced by the object with index {} in the
            'objects' list above. 0-Based indexing.
          format: int32
          minimum: 0
          type: integer
        values:
          items:
            description: 'Person or organisation in some function. e.g.:

              - authors of a statement,

              - expert at a hearing,

              - initiator of a Vorgang

              - authoring organisations of documents'
            properties:
              fachgebiet:
                type:
                  - string
                  - 'null'
              lobbyregister:
                format: uri
                type:
                  - string
                  - 'null'
              organisation:
                type: string
              person:
                type:
                  - string
                  - 'null'
            required:
              - organisation
            type: object
          type: array
      required:
        - values
        - replaced_by
      type: object
    ReplacementPutRequestInner_Gremium:
      properties:
        replaced_by:
          description: This object is replaced by the object with index {} in the
            'objects' list above. 0-Based indexing.
          format: int32
          minimum: 0
          type: integer
        values:
          items:
            description: 'A body in which decisions can be made: committees, plenary
              halls, cabinett, peoples, ...'
            properties:
              link:
                format: uri
                type:
                  - string
                  - 'null'
              name:
                description: Name of the body. 'plenum', 'regierung', 'volk' are reserved
                type: string
              parlament:
                $ref: '#/components/schemas/Parlament'
              wahlperiode:
                format: int32
                minimum: 0
                type: integer
            required:
              - parlament
              - wahlperiode
              - name
            type: object
          type: array
      required:
        - values
        - replaced_by
      type: object
    ReplacementPutRequestInner_String:
      properties:
        replaced_by:
          description: This object is replaced by the object with index {} in the
            'objects' list above. 0-Based indexing.
          format: int32
          minimum: 0
          type: integer
        values:
          items:
            type: string
          type: array
      required:
        - values
        - replaced_by
      type: object
    ReplacementPutRequest_Autor:
      properties:
        objects:
          items:
            description: 'Person or organisation in some function. e.g.:

              - authors of a statement,

              - expert at a hearing,

              - initiator of a Vorgang

              - authoring organisations of documents'
            properties:
              fachgebiet:
                type:
                  - string
                  - 'null'
              lobbyregister:
                format: uri
                type:
                  - string
                  - 'null'
              organisation:
                type: string
              person:
                type:
                  - string
                  - 'null'
            required:
              - organisation
            type: object
          type: array
        replacing:
          items:
            $ref: '#/components/schemas/ReplacementPutRequestInner_Autor'
          type: array
      required:
        - objects
      type: object
    ReplacementPutRequest_Gremium:
      properties:
        objects:
          items:
            description: 'A body in which decisions can be made: committees, plenary
              halls, cabinett, peoples, ...'
            properties:
              link:
                format: uri
                type:
                  - string
                  - 'null'
              name:
                description: Name of the body. 'plenum', 'regierung', 'volk' are reserved
                type: string
              parlament:
                $ref: '#/components/schemas/Parlament'
              wahlperiode:
                format: int32
                minimum: 0
                type: integer
            required:
              - parlament
              - wahlperiode
              - name
            type: object
          type: array
        replacing:
          items:
            $ref: '#/components/schemas/ReplacementPutRequestInner_Gremium'
          type: array
      required:
        - objects
      type: object
    ReplacementPutRequest_String:
      properties:
        objects:
          items:
            type: string
          type: array
        replacing:
          items:
            $ref: '#/components/schemas/ReplacementPutRequestInner_String'
          type: array
      required:
        - objects
      type: object
    Ressort:
      description: Ressort, which the Vorgang is associated with. Usually the name
        of a ministry
      enum:
        - Arbeit
        - Bildung
        - Digitalisierung
        - Energie
        - Ernährung
        - Europa
        - Familie/Senioren
        - Finanzen
        - Forschung
        - Forsten
        - Frauen/Gleichstellung
        - Gesundheit/Pflege/Prävention
        - Heimat
        - Inneres
        - Integration/Migration
        - Jugend
        - Justiz
        - Kinder
        - Klimaschutz
        - Kommunales
        - Kunst/Kultur
        - Landes-/Stadtentwicklung
        - Ländlicher Raum
        - Landwirtschaft
        - Soziales
        - Sport
        - Tourismus
        - Umwelt
